[package]
name = "ruzu_ios"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "ruzu 的 iOS 宿主门面（C ABI），供 Swift/UIKit 外壳调用"

# 故意不写 version.workspace = true：这个 crate 即使被移出 workspace 也能独立编译
# （CI 里补丁脚本会把它加进 workspace members，但脚本失败时不应连带炸掉构建）。

[lib]
name = "ruzu_ios"
crate-type = ["staticlib"]

[features]
# 链接测试开关：把真正的模拟器核心（core）编进来。
# **默认关闭**，这样即使核心在 iOS 上还编不过，IPA 也永远能产出来
# （手机里始终有一个能自检的 App）。等整条链路打通再把默认值改成 ["core"]。
core = ["dep:ruzu_core"]

[dependencies]
libc = "0.2"
# 真正的模拟器核心（可选）。放在普通 [dependencies] 里而不是 target 表里：
# 这个 crate 本来就只编 iOS，feature 默认关闭，所以不会牵连任何平台。
ruzu_core = { package = "core", path = "../core", optional = true }

[profile.dev]
opt-level = 1

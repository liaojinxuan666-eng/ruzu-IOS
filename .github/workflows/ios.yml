name: ios

# ruzu → iOS 构建流水线（**纯手动触发**，不会因为 push 而自动跑）
#
#   Actions → 左侧选 ios → Run workflow → 勾选项 → 运行
#
# 一次运行产出：
#   Ruzu-unsigned.ipa        —— 未签名 IPA，用 SideStore / AltStore / TrollStore 侧载
#   RuzuApp.entitlements     —— 默认权限（不越狱路线：get-task-allow，配合调试器开 JIT）
#   Ruzu-jailbreak.entitlements —— 越狱路线附加权限（可选，不越狱时不要用）
#   probe-logs-ios           —— 每个 crate 对 aarch64-apple-ios 的编译探针日志
#
# 设计要点：探针步骤 continue-on-error，所以即使 core/audio_core 还编不过，
# IPA 也照样能出来 —— 保证手机里随时有一个能打开、能自检的 App。

on:
  workflow_dispatch:
    inputs:
      run_probe:
        description: "运行交叉编译探针（收集各 crate 的 iOS 编译错误，不阻塞构建）"
        type: boolean
        default: true
      build_ipa:
        description: "构建 Rust 静态库 + Xcode 工程 + 打包未签名 IPA"
        type: boolean
        default: true

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  RUST_BACKTRACE: "1"
  IOS_TARGET: aarch64-apple-ios

jobs:
  build:
    runs-on: macos-14          # Apple Silicon runner，自带 Xcode + iOS SDK
    timeout-minutes: 150
    steps:

      - name: 拉取源码（含子模块 rhazel / rxbyak）
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      # GitHub runner 拉 crates.io / github.com 偶尔抽风，先热身 + 统一 HTTP/1.1
      - name: 网络抗抖动
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000
          for host in https://static.crates.io/ https://index.crates.io/ https://github.com/; do
            for i in 1 2 3; do
              curl -sSf -m 20 -o /dev/null "$host" && break || { echo "retry $host ($i)"; sleep 5; }
            done
          done

      - name: 准备 Rust + iOS target
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$IOS_TARGET"
          rustc --version --verbose
          xcodebuild -version

      - name: 确认子模块到位
        run: |
          test -f externals/rhazel/src/block_of_code.rs || { echo "!! rhazel 缺失（AArch64 JIT 必需）"; exit 1; }
          test -d externals/rxbyak/src || echo "!! rxbyak 缺失（video_core 会编不过）"

      - name: 打 iOS 补丁
        run: python3 ios/patches/apply_ios_patches.py

      # video_core 的 build.rs 要用 glslangValidator 把 present 着色器编成 SPIR-V
      # （探针阶段就会跑到它），xcodegen 用来生成 Xcode 工程。
      - name: 安装构建工具（glslang / xcodegen）
        run: |
          brew install glslang xcodegen
          glslangValidator --version | head -2
          xcodegen --version

      # ── P0：交叉编译探针（不阻塞构建，只为收集错误）────────────────────
      - name: P0 交叉编译探针
        if: ${{ inputs.run_probe }}
        continue-on-error: true
        run: bash ios/ci/probe.sh probe-logs

      - name: 汇总探针错误
        if: ${{ always() && inputs.run_probe }}
        run: |
          : > probe-logs/top-errors.txt
          for f in probe-logs/*.log; do
            [ -f "$f" ] || continue
            grep -nE '^error(\[|:)|error: could not|failed to run custom build|Could not find directory|no method named|unresolved import' "$f" \
              | head -8 | sed "s|^|$(basename "$f"): |" >> probe-logs/top-errors.txt || true
          done
          {
            echo "## aarch64-apple-ios 编译探针"
            echo
            echo '```'
            cat probe-logs/summary.txt 2>/dev/null || echo "(没有结果)"
            echo '```'
            echo
            echo "### 各 crate 首要错误"
            echo '```'
            head -120 probe-logs/top-errors.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ── 构建 iOS 门面静态库 ───────────────────────────────────────────
      # 优先带 core（真正的模拟器核心）构建；失败则自动回退纯外壳，
      # 保证无论如何都有 IPA 产出。
      - name: 构建门面静态库（优先带 core）
        if: ${{ inputs.build_ipa }}
        run: |
          set -o pipefail
          if cargo build --release --target "$IOS_TARGET" -p ruzu_ios --features core > core-link.log 2>&1; then
            echo "带 core 构建成功"
            echo "on" > .core_built
          else
            echo "带 core 构建失败，回退纯外壳："
            tail -40 core-link.log
            cargo build --release --target "$IOS_TARGET" -p ruzu_ios
            echo "off" > .core_built
          fi
          ls -la "target/$IOS_TARGET/release/libruzu_ios.a"

      # ── 生成 Xcode 工程并编译 App ─────────────────────────────────────
      # audio_core 的 Opus 解码通过 #[link(name = "opus")] 引用 libopus，
      # iOS 上没有系统 libopus → CI 里给 iOS 交叉编译一份静态库。
      - name: 构建 libopus（iOS 静态库）
        if: ${{ inputs.build_ipa }}
        run: |
          set -e
          V=1.4
          curl -sSL -o /tmp/opus.tgz "https://github.com/xiph/opus/archive/refs/tags/v${V}.tar.gz"
          tar xzf /tmp/opus.tgz -C /tmp
          cmake -S "/tmp/opus-${V}" -B /tmp/opus-build \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE=Release \
            -DOPUS_BUILD_SHARED_LIBRARY=OFF \
            -DOPUS_BUILD_TESTING=OFF \
            -DOPUS_BUILD_PROGRAMS=OFF > /dev/null
          cmake --build /tmp/opus-build -j 4
          mkdir -p "$GITHUB_WORKSPACE/third_party/opus"
          cp "$(find /tmp/opus-build -name 'libopus.a' | head -1)" "$GITHUB_WORKSPACE/third_party/opus/"
          ls -la "$GITHUB_WORKSPACE/third_party/opus/"

      - name: 生成 Ruzu.xcodeproj
        if: ${{ inputs.build_ipa }}
        run: |
          cd ios && xcodegen generate && ls -la

      # XcodeGen 2.46 默认写 Xcode 16 的工程格式（objectVersion 77），而 runner 上
      # 可能是 Xcode 15.4，会直接报：
      #   "Unable to read project ... future Xcode project file format (77)"
      # 降到 56 两个版本都能读，稳。
      - name: 把工程格式降到 Xcode 15 也能读的版本
        if: ${{ inputs.build_ipa }}
        run: |
          PBX=ios/Ruzu.xcodeproj/project.pbxproj
          echo "Xcode 版本："; xcodebuild -version || true
          echo "改前 objectVersion：$(grep -m1 objectVersion $PBX)"
          python3 - "$PBX" <<'PY'
          import re, sys, pathlib
          p = pathlib.Path(sys.argv[1])
          t = p.read_text()
          t2 = re.sub(r"objectVersion = \d+;", "objectVersion = 56;", t, count=1)
          if t2 != t:
              p.write_text(t2)
              print("已降到 56")
          else:
              print("未改动（可能已是 56 或格式不同）")
          PY
          echo "改后 objectVersion：$(grep -m1 objectVersion $PBX)"

      - name: xcodebuild（未签名）
        if: ${{ inputs.build_ipa }}
        run: |
          set -o pipefail
          xcb() {
            xcodebuild \
              -project ios/Ruzu.xcodeproj \
              -scheme Ruzu \
              -configuration Release \
              -sdk iphoneos \
              -derivedDataPath build/DerivedData \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGN_ENTITLEMENTS="" \
              build
          }
          if xcb > xcodebuild-core.log 2>&1; then
            echo "链接成功（带 core 的静态库已进 App）"
            cp xcodebuild-core.log xcodebuild.log
            tail -10 xcodebuild.log
          else
            echo "带 core 链接失败，回退纯外壳重试（下面是首次失败的关键行）"
            # 只挑真正的报错，不要把 ld: warning 也算进来
            grep -nE "^error:|error: |Undefined symbols for architecture|ld: symbol\(s\) not found|clang: error|_OBJC_CLASS_|framework not found" xcodebuild-core.log \
              | grep -v "ld: warning" | head -40 || true
            echo "---- 首次失败日志尾部 ----"
            tail -25 xcodebuild-core.log
            cp xcodebuild-core.log xcodebuild.log
            cargo build --release --target "$IOS_TARGET" -p ruzu_ios
            echo "off" > .core_built
            xcb > xcodebuild.log 2>&1 || true
            tail -10 xcodebuild.log
          fi

      - name: xcodebuild 错误摘要
        if: ${{ always() && inputs.build_ipa }}
        run: |
          if [ ! -f xcodebuild.log ]; then
            echo "xcodebuild.log 不存在（xcodebuild 那一步没跑到，先看上面哪一步挂了）"
            exit 0
          fi
          {
            echo "## xcodebuild 错误摘要"
            echo
            echo '```'
            grep -nE "error:|error \[|Undefined symbols|ld: |Cannot find|does not exist|has no member|unavailable|warning: no rule" xcodebuild.log \
              | head -60 || echo "(没有匹配到错误行)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if grep -q "BUILD SUCCEEDED" xcodebuild.log; then
            echo "构建成功"
          else
            echo "构建失败，错误行："
            grep -nE "error:" xcodebuild.log | head -40 || true
            exit 1
          fi

      - name: 打包未签名 IPA
        if: ${{ inputs.build_ipa }}
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Ruzu.app"
          test -d "$APP" || { echo "!! 没找到 Ruzu.app"; ls -R build/DerivedData/Build/Products || true; exit 1; }
          echo "== App 内容 =="; ls -la "$APP"
          echo "== 架构 =="; file "$APP/Ruzu"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cp ios/RuzuApp/RuzuApp.entitlements dist/RuzuApp.entitlements
          cp ios/RuzuApp/RuzuApp-jailbreak.entitlements dist/Ruzu-jailbreak.entitlements
          cd dist && zip -qry Ruzu-unsigned.ipa Payload
          ls -la
          echo "IPA 大小：$(du -h Ruzu-unsigned.ipa | cut -f1)"

      # 越狱环境（TrollStore 等）需要把 JIT 相关 entitlements 嵌进二进制里。
      # 真机实测：没有 dynamic-codesigning / CS_DEBUGGED 时，
      #   mmap(MAP_JIT) → errno=22 (EINVAL)，裸 RWX 映射虽成功但一执行就 SIGBUS。
      - name: 生成带 JIT 权限的越狱版 IPA（ad-hoc 签名）
        if: ${{ inputs.build_ipa }}
        run: |
          APP="build/DerivedData/Build/Products/Release-iphoneos/Ruzu.app"
          rm -rf build/Ruzu-signed.app dist2
          cp -R "$APP" build/Ruzu-signed.app
          codesign --force --sign - \
            --entitlements ios/RuzuApp/RuzuApp-jailbreak.entitlements \
            build/Ruzu-signed.app
          echo "== 签名后的 entitlements =="
          codesign -d --entitlements - build/Ruzu-signed.app || true
          mkdir -p dist2/Payload
          cp -R build/Ruzu-signed.app dist2/Payload/Ruzu.app
          ( cd dist2 && zip -qry ../dist/Ruzu-jailbreak.ipa Payload )
          ls -la dist

      - name: 上传产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruzu-ios-${{ github.sha }}
          path: |
            dist/Ruzu-unsigned.ipa
            dist/Ruzu-jailbreak.ipa
            dist/RuzuApp.entitlements
            dist/Ruzu-jailbreak.entitlements
            xcodebuild.log
            xcodebuild-core.log
            core-link.log
            probe-logs/
          retention-days: 30
          if-no-files-found: warn
